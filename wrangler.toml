name = "thanh"
main = "worker.js"
compatibility_date = "2026-11-18"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

# Liên kết KV Namespace trong Cloudflare Dashboard: Settings -> Variables and KV (hoặc Bindings) -> Add KV binding (POSTS_KV)
# Hoặc sau khi tạo KV trên tài khoản Cloudflare của bạn, mở ghi chú dòng bên dưới và điền ID vào:
[[kv_namespaces]]
binding = "POSTS_KV"
id = "998d7b8018334359920f3c5ca1117b86"
